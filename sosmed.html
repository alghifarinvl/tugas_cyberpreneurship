  .sosmed-link {

    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    background: #3a2117;
    border: 1px solid #5c3a26;
    border-radius: 12px;
    text-decoration: none;
    color: #f3e6d8;
    font-size: 15px;
    font-weight: 500;
  }
  .sosmed-link:hover { border-color: #d9a679; background: #6b1e2c; }
  .sosmed-icon { font-size: 20px; }

  footer {
    text-align: center;
    padding: 30px;
    color: #8a6a55;
    font-size: 13px;
    border-top: 1px solid #3a2117;
  }

  @media (max-width: 640px) {
    nav { padding: 16px 20px; flex-direction: column; gap: 12px; }
    .page-banner { padding: 50px 20px; }
  }
</style>
