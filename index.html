<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tugas Cyberpreneurship - Alghifari</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    min-height: 100vh;
    padding: 40px 20px;
    color: #e2e8f0;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
  }
  .header {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 28px 32px;
    margin-bottom: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }
  .label {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #94a3b8;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 24px;
    margin-bottom: 16px;
    color: #f8fafc;
  }
  .info p {
    font-size: 14px;
    color: #cbd5e1;
    margin-bottom: 2px;
  }
  .info p strong { color: #f8fafc; }

  h2 {
    font-size: 15px;
    color: #94a3b8;
    margin: 0 0 12px 4px;
    font-weight: 600;
  }
  .list {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 8px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }
  .pertemuan {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    border-radius: 10px;
    text-decoration: none;
    color: #f1f5f9;
  }
  .pertemuan:hover { background: #0f172a; }
  .pertemuan + .pertemuan { border-top: 1px solid #334155; }
  .p-left { display: flex; align-items: center; gap: 14px; }
  .p-num {
    width: 36px; height: 36px;
    background: #334155;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
    flex-shrink: 0;
  }
  .p-title { font-size: 15px; font-weight: 500; }
  .p-sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
  .p-icon { font-size: 18px; color: #94a3b8; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="label">Tugas Mata Kuliah</div>
      <h1>Cyberpreneurship</h1>
      <div class="info">
        <p><strong>Nama:</strong> Alghifari</p>
        <p><strong>NIM:</strong> 2412501716</p>
      </div>
    </div>

    <h2>Rangkuman Per Pertemuan</h2>
    <div class="list">

      <a class="pertemuan" href="pertemuan1.pdf" target="_blank">
        <div class="p-left">
          <div class="p-num">1</div>
          <div>
            <div class="p-title">Pertemuan 1</div>
            <div class="p-sub">Rangkuman materi</div>
          </div>
        </div>
        <div class="p-icon">↗</div>
      </a>

    </div>
  </div>
</body>
</html>
